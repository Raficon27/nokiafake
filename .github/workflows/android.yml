name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NokiaMode-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NokiaFake-v1.3.1-debug.apk
          if gh release view v1.3.1-debug >/dev/null 2>&1; then
            gh release upload v1.3.1-debug NokiaFake-v1.3.1-debug.apk --clobber
          else
            gh release create v1.3.1-debug NokiaFake-v1.3.1-debug.apk \
              --title 'NokiaFake 1.3.1 Debug' \
              --notes 'Debug APK with accessible exit corner and touch-count feedback. Verify corner taps and shade gestures on the QIN F21 Pro.' \
              --prerelease --target "$GITHUB_SHA"
          fi
